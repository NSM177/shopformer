paths:
  data_dir: "data/raw/PoseLift"
  pose_train_dir: "data/raw/PoseLift/pose/train"
  pose_test_dir: "data/raw/PoseLift/pose/test"
  gt_mask_dir: "data/raw/PoseLift/gt/test_frame_mask"
  checkpoints_dir: "checkpoints"
  bundle_dir: "checkpoints/shopformer_v1"
  gcae_ckpt: "checkpoints/gcae_best.pt"
  shopformer_ckpt: "checkpoints/shopformer_best.pt"
  threshold_file: "checkpoints/threshold.json"
  clips_dir: "data/clips"
  db_path: "data/events.db"

video:
  target_fps: 15
  vid_res: [1920, 1080]
  swap_yx_from_poselift_json: true

pose_track:
  yolo_model: "models/pretrained/yolov8n-pose.pt"
  tracker_config: "bytetrack.yaml"
  conf_threshold: 0.25
  iou_threshold: 0.45
  device: "cuda:0"

person_clips:
  margin_ratio: 0.15
  clip_sec: 3.0
  hop_sec: 1.0
  num_frames: 16
  frame_size: 224
  min_span_ratio: 0.8
  min_frames: 8
  stale_sec: 5.0

preprocess:
  window_size: 12
  window_stride_train: 6
  window_stride_eval: 1
  max_missing_frames: 2
  smoothing_window: 8
  num_keypoints_coco17: 17
  num_keypoints_coco18: 18
  symm_range: false

model:
  in_channels: 2
  h_dim: 2
  num_tokens: 2
  token_dim: 144
  transformer_heads: 12
  transformer_layers: 4
  transformer_latent_dim: 64
  dropout: 0.1
  conv_oper: "sagc"
  act: "relu"
  headless: false

training:
  seed: 42
  batch_size: 64
  num_workers: 0
  num_transform: 2
  gcae_epochs: 10
  gcae_lr: 0.001
  gcae_weight_decay: 0.00005
  gcae_reg_alpha: 1.0
  transformer_epochs: 10
  transformer_lr: 0.00005
  transformer_weight_decay: 0.00005

evaluation:
  gaussian_smooth_max_sigma: 7
  paper_metrics:
    auc_roc: 69.15
    auc_pr: 44.49
    eer: 0.38

alerting:
  calibration_percentile: 99.0
  default_threshold: 0.30
  score_smooth_window: 3
  consecutive_windows_k: 3
  cooldown_seconds: 10.0
  wait_admin_seconds: 30.0
  auto_lock: false
  clip_duration_seconds: 5.0

door:
  default_ttl_sec: 45
  max_ttl_sec: 120
  gpio_pin: 26
  active_high: true
  fail_safe_state: "unlocked"
  cmd_topic_template: "store/{store_id}/door/cmd"
  status_topic_template: "store/{store_id}/door/status"
  audit_log_path: "data/door_audit.log"

mqtt:
  broker_host: "localhost"
  broker_port: 1883
  store_id: "store_01"
  cam_id: "cam_01"
  topic_template: "store/{store_id}/cam/{cam_id}/alert"
  status_topic_template: "store/{store_id}/cam/{cam_id}/status"
  door_cmd_topic_template: "store/{store_id}/door/cmd"
  door_status_topic_template: "store/{store_id}/door/status"
  keepalive: 60

dashboard:
  host: "0.0.0.0"
  port: 8000

pipeline:
  capture_queue_size: 2
  score_queue_size: 32
  reconnect_delay_seconds: 1.0
  max_reconnect_attempts: 3
  pre_event_seconds: 3.0
  post_event_seconds: 2.0
  status_interval_seconds: 5.0
  outbox_poll_interval_seconds: 0.5
  outbox_max_retries: 10


