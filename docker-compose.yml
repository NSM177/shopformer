services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: shopformer-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./configs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: shopformer-dashboard
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - STORE_ID=${STORE_ID:-store_01}
      - PIPELINE_SERVICE_URL=${PIPELINE_SERVICE_URL:-http://pipeline:8001}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      - mosquitto
      - pipeline
    restart: unless-stopped

  fake_door:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: shopformer-fake-door
    command:
      - python
      - scripts/fake_door.py
      - --config
      - configs/default.yaml
      - --mqtt-host
      - mosquitto
      - --mqtt-port
      - "1883"
      - --store-id
      - ${STORE_ID:-store_01}
    healthcheck:
      disable: true
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - STORE_ID=${STORE_ID:-store_01}
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      - mosquitto
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    container_name: shopformer-pipeline
    ports:
      - "8001:8001"
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - STORE_ID=${STORE_ID:-store_01}
      - CAM_ID=${CAM_ID:-cam_01}
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./models:/app/models:ro
    depends_on:
      - mosquitto
    restart: unless-stopped
